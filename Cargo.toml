[workspace]
members = [
    "crates/event-dispatcher-contracts",
    "crates/event-dispatcher",
    "crates/stopwatch",
    "crates/clock",
    "crates/string",
    "crates/psr-container",
    "crates/psr-log",
    "crates/yaml",
    "crates/dotenv",
    "crates/deprecation-contracts",
    "crates/filesystem",
    "crates/config",
    "crates/dependency-injection",
    "crates/translation",
    "crates/console",
    "crates/http-foundation",
    "crates/routing",
    "crates/http-kernel",
    "crates/runtime",
    "crates/css-selector",
    "crates/options-resolver",
    "crates/password-hasher",
    "crates/finder",
    "crates/mime",
    "crates/twig",
    "crates/twig-integration",
    "crates/expression-language",
    "crates/doctrine-dbal",
    "examples/request-lab",
    "fixtures/converter-app",
    "spikes/twig-trial/compiler",
    "spikes/twig-trial/runtime",
    "spikes/twig-trial/demo",
    "spikes/di-trial/compiler",
    "spikes/di-trial/runtime",
    "spikes/di-trial/demo",
]
resolver = "3"

# PHP behaviour crates, moved to php2rust-compatibility-tools (November 26).
# The package aliases keep the `php_value`, `php_pcre` and `php_dom` names
# in code. To work on both repositories, override the git source with a
# local path in an uncommitted .cargo/config.toml (see README.md).
[workspace.dependencies]
php-value = { package = "php2rust-value", git = "https://github.com/D-Nations/php2rust-compatibility-tools", rev = "977342827ba414362c6af60f38dd376f2fbcfd72" }
php-pcre = { package = "php2rust-regex", git = "https://github.com/D-Nations/php2rust-compatibility-tools", rev = "977342827ba414362c6af60f38dd376f2fbcfd72" }
php-dom = { package = "php2rust-dom", git = "https://github.com/D-Nations/php2rust-compatibility-tools", rev = "977342827ba414362c6af60f38dd376f2fbcfd72" }

# Lints for every member that sets `[lints] workspace = true`. Members opt in
# one at a time, once they pass with `-D warnings`; see PLAN.md
# ("Clippy rule set"). Raise strictness in steps, never as a whole
# `nursery` or `restriction` group.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that only add noise to a port.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Port rules (AGENTS.md): no panics on external input, no stubs or debug
# output left behind. Tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "warn"
# Converter contract 0.1, section 3: never hold a lock across `.await`.
await_holding_lock = "deny"

# Keep source locations for normal development without full debug symbols.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Password hashing is slow on purpose, and much slower unoptimized: the
# hash crates are optimized in development builds too (workspace code stays
# a debug build), so that tests with upstream's default costs (bcrypt 13,
# Argon2id 64 MiB) finish in seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha-crypt]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3

# Use cargo test --profile dev-full (or cargo build --profile dev-full)
# when a debugger needs local variables and complete type information.
[profile.dev-full]
inherits = "dev"
debug = 2
