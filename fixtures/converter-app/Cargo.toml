[package]
name = "converter-fixture-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "M1-D converter fixture: hand-authored, generated-code-shaped Rust for oracle/apps/converter-fixture (converter contract 0.2)"

[dependencies]
axum = "0.8.9"
php-value = { path = "../../crates/php-value" }
symfony-http-foundation = { path = "../../crates/http-foundation" }
symfony-http-kernel = { path = "../../crates/http-kernel" }
symfony-routing = { path = "../../crates/routing" }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0.154"

# Converter contract 0.1, section 3: generated code never holds a lock
# across `.await`.
[lints.clippy]
await_holding_lock = "deny"
