[package]
name = "request-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Independent consumer of the ported Symfony kernel, served by the Axum adapter"

[dependencies]
php-value = { path = "../../crates/php-value" }
symfony-event-dispatcher = { path = "../../crates/event-dispatcher" }
symfony-http-foundation = { path = "../../crates/http-foundation" }
symfony-routing = { path = "../../crates/routing" }
symfony-http-kernel = { path = "../../crates/http-kernel" }
symfony-runtime = { path = "../../crates/runtime" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
