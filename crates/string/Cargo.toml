[package]
name = "symfony-string"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The parts of Symfony String that Console needs: UnicodeString's graphemes, width and wordwrap"

[dependencies]
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

[dev-dependencies]
php-value = { path = "../php-value", features = ["vectors"] }
serde_json = "1.0.154"
