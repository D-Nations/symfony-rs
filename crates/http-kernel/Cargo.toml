[package]
name = "symfony-http-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Small typed subset of Symfony's request lifecycle for Axum applications"

[dependencies]
axum = "0.8.9"
php-value = { path = "../php-value" }
symfony-deprecation-contracts = { path = "../deprecation-contracts" }
symfony-event-dispatcher = { path = "../event-dispatcher" }
symfony-http-foundation = { path = "../http-foundation" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
