[package]
name = "symfony-http-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Symfony HttpKernel's request lifecycle on HttpFoundation, and a typed subset for Axum applications"

[dependencies]
axum = "0.8.9"
php-value = { path = "../php-value" }
symfony-deprecation-contracts = { path = "../deprecation-contracts" }
symfony-event-dispatcher = { path = "../event-dispatcher" }
symfony-http-foundation = { path = "../http-foundation" }
psr-container = { path = "../psr-container" }
psr-log = { path = "../psr-log" }
# realpath() for the welcome page.
symfony-finder = { path = "../finder" }
symfony-routing = { path = "../routing" }

[dev-dependencies]
base64 = "0.23.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
php-value = { path = "../php-value", features = ["vectors"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
