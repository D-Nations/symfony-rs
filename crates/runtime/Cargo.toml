[package]
name = "symfony-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Symfony Runtime's HttpKernelRunner, and an Axum adapter that serves a ported Symfony kernel as nginx and PHP-FPM would"

[dependencies]
axum = "0.8.9"
php-value = { workspace = true }
symfony-http-foundation = { path = "../http-foundation" }
symfony-http-kernel = { path = "../http-kernel" }
# spawn_blocking (a PHP request runs on one thread, whose per-thread
# superglobals it owns) and the oneshot that sends the response at
# fastcgi_finish_request(); already in the lock through axum.
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
symfony-event-dispatcher = { path = "../event-dispatcher" }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
