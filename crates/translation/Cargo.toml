[package]
name = "symfony-translation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/translation component (subset)"

[dependencies]
php-dom = { path = "../php-dom" }
php-value = { path = "../php-value" }
