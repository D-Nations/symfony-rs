[package]
name = "symfony-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/config component"

[features]
# Definition/Dumper/YamlReferenceDumper.php, which writes values with
# symfony/yaml's Inline::dump() (upstream's require-dev).
yaml = ["dep:symfony-yaml"]

[dependencies]
php-dom = { path = "../php-dom" }
php-pcre = { path = "../php-pcre" }
php-value = { path = "../php-value" }
symfony-deprecation-contracts = { path = "../deprecation-contracts" }
# GlobResource (Glob::toRegex(), the Finder fallback) and the filesystem
# as PHP's stream layer presents it.
symfony-finder = { path = "../finder" }
# dumpFile(), readFile() and chmod() for the caches, and parse_url()'s
# scheme (FileLocator::isAbsolutePath()).
symfony-filesystem = { path = "../filesystem" }
# hash('xxh128'): DirectoryResource::__toString(), GlobResource's hash
# (PLAN.md stack row).
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }
symfony-yaml = { path = "../yaml", optional = true }

[dev-dependencies]
# The tests cover YamlReferenceDumper too.
symfony-config = { path = ".", features = ["yaml"] }
symfony-yaml = { path = "../yaml" }
php-value = { path = "../php-value", features = ["vectors"] }
serde_json = "1.0.154"

[lints]
workspace = true
