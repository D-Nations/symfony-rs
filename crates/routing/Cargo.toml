[package]
name = "symfony-routing"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Typed subset of Symfony routing and URL generation"

[features]
# RouteCollection's resources (symfony/config's ResourceInterface, which
# upstream lists in require-dev only).
config = ["dep:symfony-config"]

[dependencies]
php-pcre = { workspace = true }
php-value = { workspace = true }
psr-log = { path = "../psr-log" }
symfony-config = { path = "../config", optional = true }
symfony-deprecation-contracts = { workspace = true }
symfony-http-foundation = { path = "../http-foundation" }

[dev-dependencies]
# The tests cover RouteCollection's resources too.
symfony-routing = { path = ".", features = ["config"] }
symfony-config = { path = "../config" }
php-value = { workspace = true, features = ["vectors"] }
serde_json = "1.0.154"

[lints]
workspace = true
