[package]
name = "symfony-clock"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/clock component"

[dependencies]
# IANA time zones only (PLAN.md stack row "Clock"): the bundled tzdb, so
# the answers do not depend on the host's zoneinfo files.
jiff = { version = "1.0.3", default-features = false, features = ["std", "tzdb-bundle-always"] }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
