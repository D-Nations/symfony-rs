[package]
name = "php-value"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "PHP values and engine behaviour (arrays, strings, number conversions), written from PHP's observed behaviour"

[features]
# Reading values recorded from PHP, for tests (src/vectors.rs).
vectors = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
php-value = { path = ".", features = ["vectors"] }
serde_json = "1.0.154"
