[package]
name = "symfony-yaml"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/yaml component"

[features]
# The lint:yaml command (Command/LintCommand.php), on symfony-console.
console = ["dep:symfony-console"]

[dependencies]
php-value = { workspace = true }
regex = "1.13.2"
symfony-console = { path = "../console", optional = true }

[dev-dependencies]
# The tests cover the lint:yaml command too.
symfony-yaml = { path = ".", features = ["console"] }
php-value = { workspace = true, features = ["vectors"] }
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }

[lints]
workspace = true
