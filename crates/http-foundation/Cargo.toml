[package]
name = "symfony-http-foundation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A tested subset of Symfony HttpFoundation and PHP request semantics"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
php-pcre = { workspace = true }
php-value = { workspace = true }
symfony-deprecation-contracts = { workspace = true }
symfony-expression-language = { path = "../expression-language" }
symfony-filesystem = { path = "../filesystem" }
symfony-finder = { path = "../finder" }
symfony-mime = { path = "../mime" }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "unbounded_depth"] }

[lints]
workspace = true
