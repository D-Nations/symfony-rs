[package]
name = "symfony-dependency-injection"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/dependency-injection component, for a build-time container compiler"

[dependencies]
php-value = { path = "../php-value" }
symfony-deprecation-contracts = { path = "../deprecation-contracts" }
# sprintf() for the parameter deprecation messages; the loaders, resources
# and configuration processing of later slices use the rest.
symfony-config = { path = "../config" }

[lints]
workspace = true
