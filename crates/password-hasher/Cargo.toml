[package]
name = "symfony-password-hasher"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of the symfony/password-hasher component"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
md-5 = { version = "0.11.0", default-features = false }
php-value = { workspace = true }
sha-crypt = { version = "0.6.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.2", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
serde_json = "1.0.154"

[lints]
workspace = true
