[package]
name = "di-trial-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Trial build-time DI container compiler, emitting Rust; not the M3 port"

[dependencies]
php-dom = { workspace = true }
php-value = { workspace = true }
symfony-config = { path = "../../../crates/config" }
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing"] }

[lints]
workspace = true
