name: Upstream watch
# Weekly: advisories and newer patch releases for the pinned upstream
# packages (scripts/upstream_watch.py). Opens or updates the open issue
# titled "Upstream watch" with the report.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned sources of ported packages
        run: |
          packages=$(awk -F'\t' '!/^#/ && $2 ~ /\// { print $2 }' parity/sources.tsv | sort -u)
          scripts/fetch-upstream.sh $packages
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream_watch.py --issue
